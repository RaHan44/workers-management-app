<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workforce - Worker Management Application</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-users-gear text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Workforce Manager</h1>
            </div>
            <button onclick="openModal()" class="bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg font-medium shadow transition flex items-center space-x-2">
                <i class="fa-solid fa-user-plus"></i>
                <span>Add Worker</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Workers</p>
                    <h3 id="totalWorkers" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-xl">
                    <i class="fa-solid fa-users"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Active Workers</p>
                    <h3 id="activeWorkers" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-xl">
                    <i class="fa-solid fa-user-check"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Departments</p>
                    <h3 id="totalDepts" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center text-xl">
                    <i class="fa-solid fa-building"></i>
                </div>
            </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="relative w-full sm:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterWorkers()" placeholder="Search by name or email..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
            </div>
            <div class="flex items-center space-x-3 w-full sm:w-auto">
                <select id="departmentFilter" onchange="filterWorkers()" class="w-full sm:w-auto px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                    <option value="">All Departments</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Design">Design</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Operations">Operations</option>
                </select>
            </div>
        </div>

        <!-- Worker Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider border-b border-slate-200">
                            <th class="py-3 px-6">Worker Name</th>
                            <th class="py-3 px-6">Department</th>
                            <th class="py-3 px-6">Role</th>
                            <th class="py-3 px-6">Status</th>
                            <th class="py-3 px-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="workerTableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Populated dynamically via JS -->
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="hidden text-center py-12">
                <i class="fa-solid fa-folder-open text-slate-300 text-4xl mb-3"></i>
                <p class="text-slate-500 font-medium">No workers found.</p>
            </div>
        </div>
    </main>

    <!-- Add/Edit Worker Modal -->
    <div id="workerModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl relative animate-fadeIn">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Add New Worker</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="workerForm" onsubmit="saveWorker(event)">
                <input type="hidden" id="workerId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Full Name</label>
                        <input type="text" id="name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email Address</label>
                        <input type="email" id="email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="john@company.com">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Department</label>
                            <select id="department" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm bg-white">
                                <option value="Engineering">Engineering</option>
                                <option value="Design">Design</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Operations">Operations</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Role / Title</label>
                            <input type="text" id="role" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="Frontend Dev">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Status</label>
                        <select id="status" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm bg-white">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium shadow">Save Worker</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
        &copy; 2026 Workforce Manager. Built with HTML, Tailwind CSS, and Vanilla JavaScript.
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Initial Mock Data (Saved to localStorage if empty)
        let workers = JSON.parse(localStorage.getItem('workers')) || [
            { id: 1, name: 'Alice Smith', email: 'alice@company.com', department: 'Engineering', role: 'Senior Developer', status: 'Active' },
            { id: 2, name: 'Bob Jones', email: 'bob@company.com', department: 'Design', role: 'UI/UX Lead', status: 'Active' },
            { id: 3, name: 'Charlie Brown', email: 'charlie@company.com', department: 'Marketing', role: 'SEO Analyst', status: 'Inactive' }
        ];

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', () => {
            renderWorkers();
            updateStats();
        });

        function saveToLocalStorage() {
            localStorage.setItem('workers', JSON.stringify(workers));
        }

        // Render Table Rows
        function renderWorkers(filteredData = workers) {
            const tbody = document.getElementById('workerTableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredData.forEach(worker => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="py-3 px-6 flex items-center space-x-3">
                        <div class="w-9 h-9 bg-indigo-100 text-indigo-600 font-bold rounded-full flex items-center justify-center text-sm">
                            ${worker.name.charAt(0)}
                        </div>
                        <div>
                            <p class="font-medium text-slate-800">${worker.name}</p>
                            <p class="text-xs text-slate-400">${worker.email}</p>
                        </div>
                    </td>
                    <td class="py-3 px-6 text-slate-600">${worker.department}</td>
                    <td class="py-3 px-6 text-slate-600">${worker.role}</td>
                    <td class="py-3 px-6">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${worker.status === 'Active' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-slate-100 text-slate-500 border border-slate-200'}">
                            ${worker.status}
                        </span>
                    </td>
                    <td class="py-3 px-6 text-right space-x-2">
                        <button onclick="editWorker(${worker.id})" class="text-slate-400 hover:text-indigo-600 transition" title="Edit">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteWorker(${worker.id})" class="text-slate-400 hover:text-rose-600 transition" title="Delete">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Update Header Statistics
        function updateStats() {
            document.getElementById('totalWorkers').innerText = workers.length;
            const activeCount = workers.filter(w => w.status === 'Active').length;
            document.getElementById('activeWorkers').innerText = activeCount;
            const uniqueDepts = new Set(workers.map(w => w.department)).size;
            document.getElementById('totalDepts').innerText = uniqueDepts;
        }

        // Filter and Search
        function filterWorkers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const dept = document.getElementById('departmentFilter').value;

            const filtered = workers.filter(w => {
                const matchesQuery = w.name.toLowerCase().includes(query) || w.email.toLowerCase().includes(query);
                const matchesDept = dept === '' || w.department === dept;
                return matchesQuery && matchesDept;
            });

            renderWorkers(filtered);
        }

        // Modal Controls
        function openModal() {
            document.getElementById('workerModal').classList.remove('hidden');
            document.getElementById('workerModal').classList.add('flex');
            document.getElementById('modalTitle').innerText = 'Add New Worker';
            document.getElementById('workerForm').reset();
            document.getElementById('workerId').value = '';
        }

        function closeModal() {
            document.getElementById('workerModal').classList.add('hidden');
            document.getElementById('workerModal').classList.remove('flex');
        }

        // Add or Edit Worker
        function saveWorker(e) {
            e.preventDefault();
            const id = document.getElementById('workerId').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const department = document.getElementById('department').value;
            const role = document.getElementById('role').value;
            const status = document.getElementById('status').value;

            if (id) {
                // Edit existing
                workers = workers.map(w => w.id == id ? { id: Number(id), name, email, department, role, status } : w);
            } else {
                // Add new
                const newWorker = {
                    id: Date.now(),
                    name,
                    email,
                    department,
                    role,
                    status
                };
                workers.push(newWorker);
            }

            saveToLocalStorage();
            renderWorkers();
            updateStats();
            closeModal();
        }

        // Edit Pre-fill
        function editWorker(id) {
            const worker = workers.find(w => w.id === id);
            if (!worker) return;

            document.getElementById('workerId').value = worker.id;
            document.getElementById('name').value = worker.name;
            document.getElementById('email').value = worker.email;
            document.getElementById('department').value = worker.department;
            document.getElementById('role').value = worker.role;
            document.getElementById('status').value = worker.status;

            document.getElementById('modalTitle').innerText = 'Edit Worker Details';
            document.getElementById('workerModal').classList.remove('hidden');
            document.getElementById('workerModal').classList.add('flex');
        }

        // Delete Worker
        function deleteWorker(id) {
            if (confirm('Are you sure you want to delete this worker?')) {
                workers = workers.filter(w => w.id !== id);
                saveToLocalStorage();
                renderWorkers();
                updateStats();
            }
        }
    </script>
</body>
</html>
